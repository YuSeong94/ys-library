<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="css">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
</th:block>

<th:block layout:fragment="script">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.18/lang/summernote-ko-KR.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#content').summernote({
                height: 400,
                lang: 'ko-KR',
                placeholder: '내용을 입력해주세요',
                
                // ⭐ 핵심: 수정 시 기존에 들어있던 iframe(유튜브)이 삭제되지 않게 방어!
                codeviewFilter: false,
                codeviewIframeFilter: false,

                toolbar: [
                    ['style', ['style']],
                    ['font', ['bold', 'underline', 'clear']],
                    ['color', ['color']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['table', ['table']],
                    ['insert', ['link', 'picture', 'video']],
                    ['view', ['codeview', 'help']]
                ],
                callbacks: {
                    onPaste: function (e) {
                        var bufferText = ((e.originalEvent || e).clipboardData || window.clipboardData).getData('Text');
                        e.preventDefault();
                        document.execCommand('insertText', false, bufferText);
                    }
                }
            });
        });
    </script>
</th:block>

<div layout:fragment="content" class="container board-container">
    <div class="board-card">
        <h2>✏️ 게시글 수정</h2>
        <hr>
        
        <form th:action="@{/community/board/modify/{boardSeq}(boardSeq=${board.boardSeq})}" method="post">
            
            <div class="mb-3">
                <label for="title" class="form-label fw-bold">제목</label>
                <input type="text" class="form-control" id="title" name="title" 
                      th:value="${board.title}" required>
            </div>

            <div class="mb-4">
                <label for="content" class="form-label fw-bold">내용</label>
                <textarea id="content" name="content" th:text="${board.content}"></textarea> 
            </div>

            <div class="d-flex justify-content-end">
                <a th:href="@{/community/board/view/{boardSeq}(boardSeq=${board.boardSeq})}" class="btn btn-secondary me-2">취소</a>
                <button type="submit" class="btn btn-warning">수정 완료</button>
            </div>
        </form>
    </div>
</div>
</html>
