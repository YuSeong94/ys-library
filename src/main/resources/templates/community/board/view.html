<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/css/community/list.css}">
    
    <style>
        /* 썸머노트 본문 스타일 정리 */
        .board-content {
            min-height: 300px;  /* 내용이 짧아도 최소 높이 유지 */
            line-height: 1.6;   /* 줄 간격 넉넉하게 */
        }

        /* 이미지가 화면보다 크면 자동으로 줄여줌 */
        .board-content img {
            max-width: 100%;
            height: auto;
        }

        /* 유튜브 동영상(iframe) 반응형 처리 */
        .board-content iframe {
            max-width: 100%;
        }
    </style>
</th:block>

<div layout:fragment="content" class="container board-container">
    <div class="board-card p-5"> <div class="mb-4">
            <h2 class="fw-bold" th:text="${board.title}">게시글 제목이 들어갑니다</h2>
        </div>

        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4 text-muted">
            <div>
                <span class="me-3">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${board.writer}">작성자명</span>
                </span>
                <span>
                    <i class="bi bi-clock me-1"></i>
                    <span th:text="${board.regDate}">2024-02-15</span>
                </span>
            </div>
            
            <div>
                <span class="badge bg-light text-dark border">
                    <i class="bi bi-eye me-1"></i>
                    <span th:text="${board.viewCount}">0</span>
                </span>
            </div>
        </div>

        <div class="board-content mb-5" th:utext="${board.content}">
          <p>여기에 본문 내용이 HTML로 렌더링되어 나옵니다.</p>
        </div>

        <hr class="mb-4">
        <div class="d-flex justify-content-between">
          <a th:href="@{/community/board/list}" class="btn btn-secondary">
            <i class="bi bi-list"></i> 목록
          </a>
          <div th:if="${session.loginMember != null and session.loginMember.memberSeq == board.writerSeq}">
              <a th:href="@{/community/board/modify/{boardSeq}(boardSeq=${board.boardSeq})}" class="btn btn-outline-primary me-2">
                  <i class="bi bi-pencil"></i> 수정
              </a>
              <a th:href="@{/community/board/delete/{boardSeq}(boardSeq=${board.boardSeq})}" class="btn btn-outline-danger" 
                  onclick="return confirm('정말 삭제하시겠습니까?');">
                  <i class="bi bi-trash"></i> 삭제
              </a>
          </div>
        </div>


        <div class="card mt-4 mb-5">
            <div class="card-header">
                <i class="fas fa-comments"></i> 댓글
            </div>
            <div class="card-body">
                
                <input type="hidden" id="boardSeq" th:value="${board.boardSeq}">
                <input type="hidden" id="loginMemberSeq" th:value="${session.loginMember != null ? session.loginMember.memberSeq : -1}">

                <div th:if="${session.loginMember != null}" class="mb-4">
                    <textarea id="replyContent" class="form-control" rows="3" placeholder="댓글을 남겨보세요."></textarea>
                    <div class="text-end mt-2">
                        <button type="button" class="btn btn-primary" onclick="saveReply()">등록</button>
                    </div>
                </div>
                
                <div th:unless="${session.loginMember != null}" class="mb-4 text-center p-3 bg-light rounded">
                    <span class="text-muted">로그인 후 댓글을 작성할 수 있습니다.</span>
                </div>

                <ul id="replyList" class="list-group list-group-flush">
                    </ul>
                
            </div>
        </div>



    </div>
</div>

<th:block layout:fragment="script">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <script>
    // 1. 페이지가 로드되면 즉시 댓글 목록을 불러옵니다.
    $(document).ready(function() {
        loadReplies();
    });

    // HTML에 숨겨둔 데이터 가져오기
    const boardSeq = $('#boardSeq').val();
    const loginMemberSeq = Number($('#loginMemberSeq').val());

    // Ajax 요청 시 CSRF 토큰을 자동으로 헤더에 추가하는 설정
    const token = $("meta[name='_csrf']").attr("content");
    const header = $("meta[name='_csrf_header']").attr("content");

    $(function() {
        $.ajaxSetup({
            beforeSend: function(xhr) {
                if (token && header) {
                    xhr.setRequestHeader(header, token);
                }
            }
        });
    });

    // ===== [기능 1] 댓글 목록 불러오기 (GET) =====
    function loadReplies() {
        $.ajax({
            type: "GET",
            url: `/community/reply/list/${boardSeq}`,
            success: function(replies) {
                let html = "";
                
                if(replies.length === 0) {
                    html = "<li class='list-group-item text-center text-muted'>등록된 댓글이 없습니다. 첫 댓글을 남겨보세요!</li>";
                } else {
                    replies.forEach(function(reply) {
                        let date = reply.regDatetime.substring(0, 16).replace('T', ' ');

                        // 수정 여부에 따라 딱지 생성 (isEdited 가 true면 출력)
                        let editBadge = reply.edited ? `<span class="text-danger ms-1" style="font-size: 0.75rem;">(수정됨)</span>` : ``;

                        html += `
                            <li class="list-group-item" id="reply-item-${reply.replySeq}">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <strong>${reply.writerName}</strong>
                                    <div>
                                        <small class="text-muted">${date}${editBadge}</small>`;
                        
                        // 내 댓글이면 [수정], [삭제] 버튼 표시
                        if (loginMemberSeq === reply.memberSeq) {
                            html += `
                                <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2 me-1" onclick="showEditForm(${reply.replySeq})">수정</button>
                                <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deleteReply(${reply.replySeq})">삭제</button>`;
                        }
                        
                        // 본문 내용이 들어가는 div에 id를 부여한다.
                        html += `   </div>
                                </div>
                                <div id="reply-content-${reply.replySeq}" class="reply-content mt-2" style="white-space: pre-wrap;">${reply.content}</div>
                            </li>`;
                    });
                }
                $("#replyList").html(html);
            },
            error: function(err) {
                console.error("댓글 로딩 실패", err);
            }
        });
    }

    // ===== [기능 2] 댓글 등록하기 (POST) =====
  function saveReply() {
      // 1. meta 태그에서 토큰 정보 읽어오기
      const token = $("meta[name='_csrf']").attr("content");
      const header = $("meta[name='_csrf_header']").attr("content");
      
      const content = $("#replyContent").val().trim();
      const currentBoardSeq = $("#boardSeq").val();

      if (!content) {
          alert("댓글 내용을 입력해주세요.");
          return;
      }

      const payload = {
          boardSeq: currentBoardSeq,
          content: content
      };

      $.ajax({
          type: "POST",
          url: "/community/reply/save",
          contentType: "application/json",
          data: JSON.stringify(payload),
          // 2. 서버로 보내기 전 헤더에 CSRF 토큰 심기
          beforeSend: function(xhr) {
              if (token && header) {
                  xhr.setRequestHeader(header, token);
              }
          },
          success: function(res) {
              // alert("댓글이 등록되었습니다!");
              $("#replyContent").val("");
              loadReplies();
          },
          error: function(err) {
              console.error("에러 발생:", err);
              if(err.status === 403) {
                  alert("로그인 세션이 만료되었거나 보안 오류가 발생했습니다.");
              } else {
                  alert("등록 실패: " + err.status);
              }
          }
      });
  }

    // ===== [기능 3] 댓글 삭제하기 (DELETE) =====
    function deleteReply(replySeq) {
        if (!confirm("정말 삭제하시겠습니까?")) return;

        $.ajax({
            type: "DELETE",
            url: `/community/reply/delete/${replySeq}`,
            success: function(res) {
                loadReplies(); // 삭제 후 최신 목록 다시 불러오기
            },
            error: function(err) {
                alert(err.responseText || "삭제 중 오류가 발생했습니다.");
            }
        });
    }

    // ===== [기능 4] 댓글 수정 폼 띄우기 및 취소 =====
    let originalContent = ""; // 수정을 취소할 때 복구하기 위한 변수

    function showEditForm(replySeq) {
        // 1. 이미 열려있는 다른 수정창이 있다면 닫기
        $('.edit-area').remove();
        $('.reply-content').show();

        // 2. 수정할 댓글의 기존 내용 가져오기
        const contentDiv = $(`#reply-content-${replySeq}`);
        originalContent = contentDiv.text().trim(); 

        // 3. 입력창(textarea)과 저장/취소 버튼 HTML 생성
        const editHtml = `
            <div class="edit-area mt-2" id="edit-area-${replySeq}">
                <textarea class="form-control mb-2" id="edit-input-${replySeq}" rows="3">${originalContent}</textarea>
                <div class="text-end">
                    <button type="button" class="btn btn-sm btn-primary" onclick="updateReply(${replySeq})">수정 완료</button>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="cancelEdit(${replySeq})">취소</button>
                </div>
            </div>
        `;

        // 4. 기존 텍스트를 숨기고 수정창을 삽입
        contentDiv.hide();
        contentDiv.after(editHtml);
    }

    // 수정창 닫고 원래대로 복구
    function cancelEdit(replySeq) {
        $(`#edit-area-${replySeq}`).remove();
        $(`#reply-content-${replySeq}`).show();
    }

    // ===== [기능 5] 댓글 수정 완료 (서버 전송) =====
    function updateReply(replySeq) {
        const newContent = $(`#edit-input-${replySeq}`).val().trim();

        if (!newContent) {
            alert("수정할 내용을 입력해주세요.");
            return;
        }

        if (newContent === originalContent) {
            cancelEdit(replySeq); 
            return;
        }

        const payload = {
            replySeq: replySeq,
            content: newContent
        };

        const token = $("meta[name='_csrf']").attr("content");
        const header = $("meta[name='_csrf_header']").attr("content");

        $.ajax({
            type: "PUT",
            url: "/community/reply/modify",
            contentType: "application/json",
            data: JSON.stringify(payload),
            beforeSend: function(xhr) {
                if (token && header) {
                    xhr.setRequestHeader(header, token);
                }
            },
            success: function(res) {
                loadReplies(); // 성공 시 목록 싹 새로고침
            },
            error: function(err) {
                alert(err.responseText || "수정 중 오류가 발생했습니다.");
            }
        });
    }

    </script>
</th:block>

</html>
