<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/css/community/list.css}">
    
    <style>
        /* 썸머노트 본문 스타일 정리 */
        .board-content {
            min-height: 300px;  /* 내용이 짧아도 최소 높이 유지 */
            line-height: 1.6;   /* 줄 간격 넉넉하게 */
        }

        /* ⭐ 중요: 이미지가 화면보다 크면 자동으로 줄여줌 */
        .board-content img {
            max-width: 100%;
            height: auto;
        }

        /* 유튜브 동영상(iframe) 반응형 처리 */
        .board-content iframe {
            max-width: 100%;
        }
    </style>
</th:block>

<div layout:fragment="content" class="container board-container">
    <div class="board-card p-5"> <div class="mb-4">
            <h2 class="fw-bold" th:text="${board.title}">게시글 제목이 들어갑니다</h2>
        </div>

        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4 text-muted">
            <div>
                <span class="me-3">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${board.writer}">작성자명</span>
                </span>
                <span>
                    <i class="bi bi-clock me-1"></i>
                    <span th:text="${board.regDate}">2024-02-15</span>
                </span>
            </div>
            
            <div>
                <span class="badge bg-light text-dark border">
                    <i class="bi bi-eye me-1"></i>
                    <span th:text="${board.viewCount}">0</span>
                </span>
            </div>
        </div>

        <div class="board-content mb-5" th:utext="${board.content}">
          <p>여기에 본문 내용이 HTML로 렌더링되어 나옵니다.</p>
        </div>

        <hr class="mb-4">
        <div class="d-flex justify-content-between">
          <a th:href="@{/community/board/list}" class="btn btn-secondary">
            <i class="bi bi-list"></i> 목록
          </a>
          <div th:if="${session.loginMember != null and session.loginMember.memberSeq == board.writerId}">
            <a th:href="@{/community/board/modify/{id}(id=${board.id})}" class="btn btn-outline-primary me-2">
              <i class="bi bi-pencil"></i> 수정
            </a>
            <a th:href="@{/community/board/delete/{id}(id=${board.id})}" class="btn btn-outline-danger" 
              onclick="return confirm('정말 삭제하시겠습니까?');">
              <i class="bi bi-trash"></i> 삭제
            </a>
          </div>
        </div>

    </div>
</div>
</html>
