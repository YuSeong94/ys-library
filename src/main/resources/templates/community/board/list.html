<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<div layout:fragment="content" class="container board-container">
<link rel="stylesheet" th:href="@{/css/community/list.css}">
  <div class="board-card">
    <h2>📋 게시판</h2>
    <hr>

    <div class="search-area bg-light p-3 rounded mb-4 shadow-sm text-center">
      <form class="d-flex justify-content-center align-items-center" method="get" action="/community/board/list">
        
        <select class="form-select me-2" name="searchType" style="width: 100px;">
          <option value="title" th:selected="${searchType == 'title'}">제목</option>
          <option value="content" th:selected="${searchType == 'content'}">내용</option>
          <option value="writer" th:selected="${searchType == 'writer'}">작성자</option>
        </select>
        
        <input class="form-control me-2" type="text" name="keyword" th:value="${keyword}" placeholder="검색어를 입력하세요" style="width: 250px;">
        <button class="btn btn-primary" type="submit">검색</button>
      </form>
    </div>

    <table class="table table-hover">
        <thead class="table-light">
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
                <th>조회</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(list)}">
              <td colspan="5" class="text-center py-4">게시글이 없습니다.</td>
            </tr>

            <tr th:each="board : ${list}">
              <td th:text="${board.boardSeq}">1</td>
                
              <td style="text-align: left; padding-left: 20px;">
                <a th:href="@{/community/board/view/{id}(id=${board.boardSeq})}" 
                  th:text="${board.title}" 
                  class="text-decoration-none text-dark">
                    게시글 제목
                </a>

                <span th:if="${board.newArticle}" class="new-badge">N</span>
              </td>
                
              <td th:text="${board.writer}">홍길동</td>
                
              <td th:text="${board.regDate}">2024-02-05</td>
                
              <td th:text="${board.viewCount}">0</td>
            </tr>
        </tbody>
    </table>

    <nav th:if="${!list.empty}" aria-label="Page navigation" class="pagination-area">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:if="${hasPrevBlock}">
          <a class="page-link" th:href="@{/community/board/list(page=${prevBlockPage - 1})}" aria-label="Previous Block">
            <span aria-hidden="true" class="double-arrow">&laquo;</span>
          </a>
        </li>
        <li class="page-item" th:classappend="${list.first} ? 'disabled'">
          <a class="page-link" th:href="@{/community/board/list(page=${list.number - 1})}" aria-label="Previous">
            <span aria-hidden="true">&lt;</span>
          </a>
        </li>
        <li class="page-item" th:each="page : ${#numbers.sequence(startPage, endPage)}"
        th:classappend="${page == nowPage} ? 'active'">
          <a class="page-link" th:text="${page}" 
          th:href="@{/community/board/list(page=${page - 1})}">1</a>
        </li>
        <li class="page-item" th:classappend="${list.last} ? 'disabled'">
          <a class="page-link" th:href="@{/community/board/list(page=${list.number + 1})}" aria-label="Next">
            <span aria-hidden="true">&gt;</span> 
          </a>
        </li>
        <li class="page-item" th:if="${hasNextBlock}">
          <a class="page-link" th:href="@{/community/board/list(page=${nextBlockPage - 1})}" aria-label="Next Block">
            <span aria-hidden="true" class="double-arrow">&raquo;</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="text-end mt-3">
        <a href="/community/board/write" class="btn btn-primary">글쓰기</a>
    </div>
  </div>
</div>

<th:block layout:fragment="script">
    <script>
        console.log("게시판 목록 페이지입니다.");
    </script>
</th:block>

</html>
