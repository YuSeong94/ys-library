<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"> <th:block layout:fragment="css">
    <style>
        .board-container { max-width: 900px; margin: 50px auto; }
    </style>
</th:block>

<div layout:fragment="content" class="container board-container">
    
    <h2>📋 게시판</h2>
    <hr>

    <table class="table table-hover">
        <thead class="table-light">
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
                <th>조회</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(boardList)}">
                <td colspan="5" class="text-center py-4">게시글이 없습니다.</td>
            </tr>

            <tr th:each="board : ${boardList}">
                <td th:text="${board.boardSeq}">1</td>
                
                <td>
                    <a href="#" th:text="${board.title}" class="text-decoration-none text-dark">
                        제목입니다
                    </a>
                </td>
                
                <td th:text="${board.writer}">홍길동</td>
                
                <td th:text="${board.regDate}">2024-02-05</td>
                
                <td th:text="${board.viewCount}">0</td>
            </tr>
        </tbody>
    </table>

    <div class="text-end mt-3">
        <a href="/community/board/write" class="btn btn-primary">글쓰기</a>
    </div>

</div>

<th:block layout:fragment="script">
    <script>
        console.log("게시판 목록 페이지입니다.");
    </script>
</th:block>

</html>
