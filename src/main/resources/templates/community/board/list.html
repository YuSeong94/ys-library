<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
  <th:block layout:fragment="css">
    <style>
      body {
        background-color: #f8f9fa; /* 전체 배경 연한 회색 */
      }
      
      .board-container { 
        width: 90%;
        max-width: 1300px;
        margin: 80px auto;
      }
      
      .table th, .table td {
          padding: 15px 10px; /* 위아래 여백을 15px로 늘림 */
          vertical-align: middle; /* 글자 세로 중앙 정렬 */
      }

      .board-card {
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.05);
        padding: 40px;
        margin-top: 50px;
        margin-bottom: 50px;
      }

      /* ✅ 테이블 디자인 디테일 잡기 */
      .table th {
          text-align: center; /* 헤더는 모두 가운데 정렬 */
          background-color: #f8f9fa; /* 헤더 배경색 살짝 */
      }

      .table td {
          vertical-align: middle; /* 세로 기준 중앙 정렬 */
      }

      /* ✅ 컬럼별 정렬 커스터마이징 */
      /* 1번(번호), 3번(작성자), 4번(날짜), 5번(조회수) -> 가운데 정렬 */
      .table td:nth-child(1),
      .table td:nth-child(3),
      .table td:nth-child(4),
      .table td:nth-child(5) {
          text-align: center;
      }

      /* 2번(제목) -> 왼쪽 정렬 + 약간의 여백 */
      .table td:nth-child(2) {
          text-align: left;
          padding-left: 20px; /* 제목이 너무 딱 붙지 않게 */
      }

      .new-badge {
        display: inline-block;      /* 박스 형태 유지를 위해 */
        background-color: #dc3545;  /* 빨간색 배경 (Bootstrap Danger 색상) */
        color: white;               /* 글자색 흰색 */
        font-size: 10px;            /* 글자 크기 작게 */
        font-weight: bold;          /* 글자 굵게 */
        padding: 2px 5px;           /* 안쪽 여백 (위아래 2px, 좌우 5px) */
        border-radius: 4px;         /* 모서리 살짝 둥글게 */
        margin-left: 5px;           /* 제목과의 간격 */
        vertical-align: text-top;   /* 텍스트 높이보다 살짝 위로 */
        line-height: 1;             /* 줄 높이 타이트하게 */
      }

      .pagination-area {
        margin-top: 60px;
        margin-bottom: 15px;
      }

    </style>
  </th:block>

<div layout:fragment="content" class="container board-container">
  <div class="board-card">
    <h2>📋 게시판</h2>
    <hr>

    <table class="table table-hover">
        <thead class="table-light">
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
                <th>조회</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(list)}">
              <td colspan="5" class="text-center py-4">게시글이 없습니다.</td>
            </tr>

            <tr th:each="board : ${list}">
              <td th:text="${board.boardSeq}">1</td>
                
              <td style="text-align: left; padding-left: 20px;">
                <a th:href="@{/community/board/view/{id}(id=${board.boardSeq})}" 
                  th:text="${board.title}" 
                  class="text-decoration-none text-dark">
                    게시글 제목
                </a>

                <span th:if="${board.newArticle}" class="new-badge">N</span>
              </td>
                
              <td th:text="${board.writer}">홍길동</td>
                
              <td th:text="${board.regDate}">2024-02-05</td>
                
              <td th:text="${board.viewCount}">0</td>
            </tr>
        </tbody>
    </table>

    <nav th:if="${!list.empty}" aria-label="Page navigation" class="pagination-area">
        <ul class="pagination justify-content-center">
            
            <li class="page-item" th:classappend="${list.first} ? 'disabled'">
                <a class="page-link" th:href="@{/community/board/list(page=${list.number - 1})}">
                    <span>&laquo;</span>
                </a>
            </li>

            <li class="page-item" th:each="page : ${#numbers.sequence(startPage, endPage)}"
                th:classappend="${page == nowPage} ? 'active'">
                
                <a class="page-link" th:text="${page}" 
                  th:href="@{/community/board/list(page=${page - 1})}">1</a>
            </li>

            <li class="page-item" th:classappend="${list.last} ? 'disabled'">
                <a class="page-link" th:href="@{/community/board/list(page=${list.number + 1})}">
                    <span>&raquo;</span>
                </a>
            </li>
            
        </ul>
    </nav>



    <div class="text-end mt-3">
        <a href="/community/board/write" class="btn btn-primary">글쓰기</a>
    </div>
  </div>
</div>

<th:block layout:fragment="script">
    <script>
        console.log("게시판 목록 페이지입니다.");
    </script>
</th:block>

</html>
