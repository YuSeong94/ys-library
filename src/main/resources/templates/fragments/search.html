<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="search-bar" id="hiddenSearchBar" class="bg-white border-bottom shadow-sm align-items-center" 
         style="display: none; position: fixed; top: 0; left: 0; width: 100%; z-index: 2000; padding-top: 20px; padding-bottom: 20px;">
        
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    
                    <div class="d-flex align-items-center">
                        
                        <form action="/search" method="get" class="flex-grow-1">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
                                <input type="text" name="keyword" class="form-control bg-light border-0" placeholder="도서명, 저자, 출판사를 입력해주세요" autofocus>
                                <button class="btn btn-dark" type="submit">검색</button>
                            </div>
                        </form>

                        <button onclick="toggleSearch()" type="button" class="btn-close ms-4" aria-label="Close" style="width: 1.2em; height: 1.2em;"></button>
                        
                    </div> 
                    
                </div>
            </div>
        </div>
    </div>

    <script th:fragment="search-script">
        function toggleSearch() {
            const searchBar = document.getElementById('hiddenSearchBar');
            
            // 현재 스타일이 none 이거나 비어있으면 -> 열기
            if (searchBar.style.display === 'none' || searchBar.style.display === '') {
                // 여기서 'flex'로 바꿔주면 HTML에 있는 align-items-center가 그때 작동합니다.
                searchBar.style.display = 'flex'; 
                
                if (searchBar.classList.contains('animate__animated')) {
                    searchBar.classList.add('animate__fadeInDown');
                }
            } else {
                // 아니면 -> 닫기
                searchBar.style.display = 'none';
            }
        }
    </script>
</body>
</html>
