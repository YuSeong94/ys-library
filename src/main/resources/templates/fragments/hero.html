<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <section th:fragment="main-hero" class="main-slider-section"> 
        <div id="mainCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="5000">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1568667256549-094345857637?q=80&w=1920&auto=format&fit=crop" class="d-block w-100 main-slide-img" alt="도서관 전경">
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1920&auto=format&fit=crop" class="d-block w-100 main-slide-img" alt="독서 공간">
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?q=80&w=1920&auto=format&fit=crop" class="d-block w-100 main-slide-img" alt="서가">
                </div>
            </div>
            
            <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </section>

</body>
</html>
