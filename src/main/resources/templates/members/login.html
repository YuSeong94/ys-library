<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ys Library : 로그인</title>
    <th:block th:replace="~{fragments/common :: common-head}"></th:block>
    <style>
        /* 로그인 박스 크기 설정 (기존 400px -> 500px로 확대) */
        .login-card-width {
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div class="py-5 text-center">
        <a href="/" class="text-decoration-none text-dark">
            <h1 class="fw-bold fs-2">
                <i class="bi bi-stars text-primary me-2"></i>유성 도서관
            </h1>
        </a>
    </div>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center px-3">
        <div class="login-card-width">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold">로그인</h2>
                <p class="text-muted">서비스 이용을 위해 로그인해주세요.</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5"> <form action="/members/login" method="post">
                        
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="loginId" name="loginId" placeholder="아이디" required autofocus>
                            <label for="loginId">아이디</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호" required>
                            <label for="password">비밀번호</label>
                        </div>

                        <button class="btn btn-primary w-100 py-3 fw-bold fs-5 mb-3" type="submit">로그인</button> <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberId">
                                <label class="form-check-label text-secondary small" for="rememberId">아이디 저장</label>
                            </div>
                            <a href="#" class="text-decoration-none text-secondary small">비밀번호 찾기</a>
                        </div>
                        
                        <hr class="my-4">

                        <div class="text-center">
                            <span class="text-muted small">아직 회원이 아니신가요?</span>
                            <a th:href="@{/members/join}" class="text-decoration-none fw-bold ms-1">회원가입</a>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="mb-5"></div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    
    <th:block th:replace="~{fragments/common :: common-js}"></th:block>
</body>
</html>
