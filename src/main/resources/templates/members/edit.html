<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ys Library : 회원정보 수정</title>
    
    <th:block th:replace="~{common/common :: common-head}"></th:block>
    
    <style>
        body {
            background-color: #f8f9fa; /* 배경을 연한 회색으로 */
        }
        .edit-container {
            max-width: 600px;
            margin: 0 auto;
            /* 헤더 높이만큼 여백 주기 (헤더가 fixed-top인 경우 필수) */
            padding-top: 120px; 
            padding-bottom: 60px;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/header :: main-header}"></nav>

    <div class="edit-container w-100">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-0 pt-4 pb-0 text-center">
                <h3 class="fw-bold text-primary">회원 정보 수정</h3>
                <p class="text-muted small">변경할 정보를 입력하고 저장해주세요.</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <form th:action="@{/members/edit}" method="post">
                    
                    <div class="mb-4">
                        <label for="loginId" class="form-label fw-bold">아이디</label>
                        <input type="text" class="form-control bg-light" id="loginId" 
                               th:value="${member.loginId}" readonly>
                        <div class="form-text text-muted">아이디는 변경할 수 없습니다.</div>
                    </div>

                    <div class="mb-4">
                        <label for="name" class="form-label fw-bold">이름</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               th:value="${member.name}" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">비밀번호 변경</label>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="변경을 원하실 경우에만 입력하세요">
                    </div>

                    <hr class="my-4">

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">수정 완료</button>
                        <a th:href="@{/}" class="btn btn-outline-secondary fw-bold">취소</a>
                    </div>

                    <div class="text-end mt-4">
                        <span class="text-muted small me-1">더 이상 이용하지 않으시나요?</span>
                         <a href="#" class="text-danger text-decoration-none small fw-bold" 
                            onclick="if(confirm('정말 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) location.href='/members/delete'">
                            회원 탈퇴 &gt;
                         </a>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}" class="mt-auto"></footer>
    <th:block th:replace="~{common/common :: common-js}"></th:block>

</body>
</html>
