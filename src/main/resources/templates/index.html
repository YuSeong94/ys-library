<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>큐브 도서관</title>
    
    <th:block th:replace="~{fragments/common :: common-head}"></th:block>
    
    <link rel="stylesheet" href="/css/index.css"> 
</head>
<body>

    <div class="utility-nav bg-light border-bottom">
        <div class="container d-flex justify-content-end p-2">
            <a th:href="@{/members/login}" class="text-decoration-none me-3">로그인</a>
            <a th:href="@{/members/login}" class="text-decoration-none">회원가입</a>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">YS 도서관</a>
            
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">도서검색</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">도서관 안내</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">열린공간</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">나의 도서관</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero-section text-center text-white">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <form action="/search">
                        <div class="input-group input-group-lg">
                            <input type="text" class="form-control" placeholder="검색어를 입력하세요">
                            <button class="btn btn-primary" type="submit">검색</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <section class="service-section py-5">
        <div class="container">
            <h2 class="text-center fw-bold mb-5">주요 서비스</h2>
            <div class="service-grid">
                <a href="#" class="service-item">
                    <div class="icon-circle">🔍</div>
                    <p class="mt-3 fw-bold">도서 검색</p>
                </a>
                
                <a href="#" class="service-item">
                    <div class="icon-circle">📚</div>
                    <p class="mt-3 fw-bold">신착 도서</p>
                </a>

                <a href="#" class="service-item">
                    <div class="icon-circle">ℹ️</div>
                    <p class="mt-3 fw-bold">이용 안내</p>
                </a>

                <a href="#" class="service-item">
                    <div class="icon-circle">🪑</div>
                    <p class="mt-3 fw-bold">열람실 좌석</p>
                </a>

                <a href="#" class="service-item">
                    <div class="icon-circle">🎉</div>
                    <p class="mt-3 fw-bold">문화 행사</p>
                </a>

                <a href="#" class="service-item">
                    <div class="icon-circle">🗺️</div>
                    <p class="mt-3 fw-bold">오시는 길</p>
                </a>
            </div>
        </div>
    </section>

    <th:block th:replace="~{fragments/common :: common-js}"></th:block>
</body>
</html>
